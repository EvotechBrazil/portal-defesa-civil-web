<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Nove passos para implantação do plano de contingência</title>
  <desc id="desc">Os passos vão do cenário de risco e grupo de trabalho até validação, operação, simulado e revisão.</desc>
  <rect width="1200" height="650" rx="36" fill="#071827"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">PLANCON: DO CENÁRIO À REVISÃO</text>
  <text x="70" y="108" fill="#9fb0c2" font-family="Arial, sans-serif" font-size="19">Planejamento prévio, específico por hipótese de desastre e testado em exercício.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 155)"><rect width="320" height="105" rx="20" fill="#12283a" stroke="#38bdf8" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#0369a1"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">1</text><text x="80" y="43" fill="#e0f2fe" font-size="19" font-weight="700">Cenários de risco</text><text x="80" y="72" fill="#bae6fd" font-size="16">ameaça, exposição, vulnerabilidade</text></g>
    <g transform="translate(440 155)"><rect width="320" height="105" rx="20" fill="#12283a" stroke="#38bdf8" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#0369a1"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">2</text><text x="80" y="43" fill="#e0f2fe" font-size="19" font-weight="700">Grupo de trabalho</text><text x="80" y="72" fill="#bae6fd" font-size="16">papéis, órgãos e comunidade</text></g>
    <g transform="translate(810 155)"><rect width="320" height="105" rx="20" fill="#12283a" stroke="#38bdf8" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#0369a1"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">3</text><text x="80" y="43" fill="#e0f2fe" font-size="19" font-weight="700">Capacidades e lacunas</text><text x="80" y="72" fill="#bae6fd" font-size="16">recursos, rotas e pontos críticos</text></g>
    <g transform="translate(70 300)"><rect width="320" height="105" rx="20" fill="#382f12" stroke="#fbbf24" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#a16207"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">4</text><text x="80" y="43" fill="#fef3c7" font-size="19" font-weight="700">Ações e procedimentos</text><text x="80" y="72" fill="#fde68a" font-size="16">monitorar, alertar, evacuar, socorrer</text></g>
    <g transform="translate(440 300)"><rect width="320" height="105" rx="20" fill="#382f12" stroke="#fbbf24" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#a16207"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">5</text><text x="80" y="43" fill="#fef3c7" font-size="19" font-weight="700">Consulta pública</text><text x="80" y="72" fill="#fde68a" font-size="16">conhecimento e participação local</text></g>
    <g transform="translate(810 300)"><rect width="320" height="105" rx="20" fill="#382f12" stroke="#fbbf24" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#a16207"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">6</text><text x="80" y="43" fill="#fef3c7" font-size="19" font-weight="700">Audiência pública</text><text x="80" y="72" fill="#fde68a" font-size="16">debate, transparência e ajustes</text></g>
    <g transform="translate(70 445)"><rect width="320" height="105" rx="20" fill="#0d3b32" stroke="#34d399" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#047857"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">7</text><text x="80" y="43" fill="#d1fae5" font-size="19" font-weight="700">Validação</text><text x="80" y="72" fill="#a7f3d0" font-size="16">aprovação e responsabilidades</text></g>
    <g transform="translate(440 445)"><rect width="320" height="105" rx="20" fill="#0d3b32" stroke="#34d399" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#047857"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">8</text><text x="80" y="43" fill="#d1fae5" font-size="19" font-weight="700">Operacionalização</text><text x="80" y="72" fill="#a7f3d0" font-size="16">divulgação, treinamento e simulado</text></g>
    <g transform="translate(810 445)"><rect width="320" height="105" rx="20" fill="#451a1a" stroke="#fb7185" stroke-width="3"/><circle cx="42" cy="52" r="24" fill="#be123c"/><text x="42" y="60" fill="white" font-size="21" font-weight="700" text-anchor="middle">9</text><text x="80" y="43" fill="#ffe4e6" font-size="19" font-weight="700">Revisão contínua</text><text x="80" y="72" fill="#fecdd3" font-size="16">lições aprendidas atualizam o plano</text></g>
  </g>
  <path d="M970 570 C950 620 240 620 230 570" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
  <path d="M214 592 L230 562 L247 592" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
