<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Modelo didático dos componentes do risco de desastre</title>
  <desc id="desc">Ameaça, exposição e vulnerabilidade aumentam o risco; capacidade reduz consequências e fortalece a resiliência.</desc>
  <rect width="1200" height="560" rx="36" fill="#071827"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">RISCO NÃO É A AMEAÇA ISOLADA</text>
  <text x="70" y="111" fill="#9fb0c2" font-family="Arial, sans-serif" font-size="20">Use a fórmula como mapa mental, não como cálculo universal.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(70 170)">
      <rect width="250" height="150" rx="24" fill="#12283a" stroke="#fb923c" stroke-width="3"/>
      <text x="125" y="58" fill="#fb923c" font-size="24" font-weight="700">AMEAÇA</text>
      <text x="125" y="93" fill="#e2e8f0" font-size="18">fenômeno com</text>
      <text x="125" y="119" fill="#e2e8f0" font-size="18">potencial de dano</text>
    </g>
    <text x="346" y="253" fill="#f8fafc" font-size="36">×</text>
    <g transform="translate(375 170)">
      <rect width="250" height="150" rx="24" fill="#12283a" stroke="#38bdf8" stroke-width="3"/>
      <text x="125" y="58" fill="#38bdf8" font-size="24" font-weight="700">EXPOSIÇÃO</text>
      <text x="125" y="93" fill="#e2e8f0" font-size="18">pessoas e bens</text>
      <text x="125" y="119" fill="#e2e8f0" font-size="18">na área ameaçada</text>
    </g>
    <text x="651" y="253" fill="#f8fafc" font-size="36">×</text>
    <g transform="translate(680 170)">
      <rect width="250" height="150" rx="24" fill="#12283a" stroke="#f87171" stroke-width="3"/>
      <text x="125" y="58" fill="#f87171" font-size="24" font-weight="700">VULNERABILIDADE</text>
      <text x="125" y="93" fill="#e2e8f0" font-size="18">fragilidades que</text>
      <text x="125" y="119" fill="#e2e8f0" font-size="18">ampliam impactos</text>
    </g>
    <text x="960" y="253" fill="#f8fafc" font-size="36">→</text>
    <g transform="translate(1000 170)">
      <rect width="150" height="150" rx="75" fill="#7c2d12" stroke="#fdba74" stroke-width="3"/>
      <text x="75" y="82" fill="#fff7ed" font-size="25" font-weight="700">RISCO</text>
    </g>
  </g>
  <path d="M1068 336 C1040 455 850 486 635 486" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <path d="M650 471 L620 486 L650 502" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="383" width="535" height="112" rx="24" fill="#0d3b32" stroke="#34d399" stroke-width="3"/>
    <text x="102" y="427" fill="#34d399" font-size="24" font-weight="700">CAPACIDADE</text>
    <text x="102" y="461" fill="#d1fae5" font-size="18">recursos, conhecimento, liderança e organização</text>
    <text x="704" y="415" fill="#34d399" font-size="22" font-weight="700">REDUZ CONSEQUÊNCIAS</text>
    <text x="704" y="447" fill="#d1fae5" font-size="18">e fortalece a resiliência</text>
  </g>
</svg>
