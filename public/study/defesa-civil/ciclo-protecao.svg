<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de proteção e defesa civil em cinco fases</title>
  <desc id="desc">Prevenção, mitigação, preparação, resposta e recuperação formam um ciclo contínuo alimentado por lições aprendidas.</desc>
  <rect width="1200" height="540" rx="36" fill="#071827"/>
  <text x="600" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">CINCO FASES, UM CICLO CONTÍNUO</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(70 145)"><rect width="190" height="130" rx="24" fill="#0d3b32" stroke="#34d399" stroke-width="3"/><text x="95" y="58" fill="#34d399" font-size="23" font-weight="700">PREVENÇÃO</text><text x="95" y="91" fill="#d1fae5" font-size="17">evitar ou reduzir</text><text x="95" y="115" fill="#d1fae5" font-size="17">a formação do risco</text></g>
    <text x="285" y="218" fill="#94a3b8" font-size="34">→</text>
    <g transform="translate(315 145)"><rect width="190" height="130" rx="24" fill="#382f12" stroke="#fbbf24" stroke-width="3"/><text x="95" y="58" fill="#fbbf24" font-size="23" font-weight="700">MITIGAÇÃO</text><text x="95" y="91" fill="#fef3c7" font-size="17">limitar impactos</text><text x="95" y="115" fill="#fef3c7" font-size="17">do risco existente</text></g>
    <text x="530" y="218" fill="#94a3b8" font-size="34">→</text>
    <g transform="translate(560 145)"><rect width="190" height="130" rx="24" fill="#123047" stroke="#38bdf8" stroke-width="3"/><text x="95" y="58" fill="#38bdf8" font-size="23" font-weight="700">PREPARAÇÃO</text><text x="95" y="91" fill="#e0f2fe" font-size="17">planejar, treinar</text><text x="95" y="115" fill="#e0f2fe" font-size="17">alertar e simular</text></g>
    <text x="775" y="218" fill="#94a3b8" font-size="34">→</text>
    <g transform="translate(805 145)"><rect width="150" height="130" rx="24" fill="#451a1a" stroke="#f87171" stroke-width="3"/><text x="75" y="58" fill="#f87171" font-size="23" font-weight="700">RESPOSTA</text><text x="75" y="91" fill="#fee2e2" font-size="17">socorrer e</text><text x="75" y="115" fill="#fee2e2" font-size="17">estabilizar</text></g>
    <text x="980" y="218" fill="#94a3b8" font-size="34">→</text>
    <g transform="translate(1010 145)"><rect width="150" height="130" rx="24" fill="#32215a" stroke="#c4b5fd" stroke-width="3"/><text x="75" y="50" fill="#c4b5fd" font-size="20" font-weight="700">RECUPERAÇÃO</text><text x="75" y="85" fill="#ede9fe" font-size="17">reconstruir</text><text x="75" y="110" fill="#ede9fe" font-size="17">melhor</text></g>
  </g>
  <path d="M1085 300 C1070 385 165 410 155 300" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 326 L155 294 L173 326" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="445" fill="#fb923c" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">LIÇÕES APRENDIDAS VOLTAM À PREVENÇÃO</text>
  <text x="600" y="483" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">A recuperação fecha o evento, mas abre a redução do risco seguinte.</text>
</svg>
